{% extends "portal.html" %}
{% from "partials/icons.html" import icon %}
{% block content %}
<section class="card">
  <div class="card-head">
    <div><h2 id="day-title">Day view</h2><p id="day-sub"></p></div>
    <div class="daybar">
      <button class="btn btn-ghost btn-sm" id="prev-day" type="button" aria-label="Previous day">←</button>
      <input class="input" type="date" id="day-pick" aria-label="Choose a date">
      <button class="btn btn-ghost btn-sm" id="next-day" type="button" aria-label="Next day">→</button>
      <button class="btn btn-quiet btn-sm" id="go-today" type="button">Today</button>
    </div>
  </div>
  <div class="weekstrip" id="weekstrip"></div>
  <div id="day-body"></div>
</section>
{% endblock %}

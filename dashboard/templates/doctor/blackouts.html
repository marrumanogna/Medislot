{% extends "portal.html" %}
{% from "partials/icons.html" import icon %}
{% block content %}
<section class="card">
  <div class="card-head"><div><h2>Blackout dates</h2><p>No slots are offered on these days — leave, conferences, holidays.</p></div></div>
  <form id="bo-form" class="card-body" style="border-bottom:1px solid var(--line)" novalidate>
    <div class="form-grid" style="grid-template-columns:200px 1fr auto;align-items:end">
      <div class="field"><label for="bo-date">Date</label><input class="input" id="bo-date" type="date" required></div>
      <div class="field"><label for="bo-reason">Reason (optional)</label><input class="input" id="bo-reason" maxlength="255" placeholder="e.g. Conference travel"></div>
      <button class="btn btn-primary" type="submit" data-busy="Adding…">Add date</button>
    </div>
    <div class="alert alert-error hidden" id="bo-err" role="alert" style="margin-top:12px"></div>
  </form>
  <div id="bo-body"><div class="skel-block"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div></div></div>
</section>
{% endblock %}

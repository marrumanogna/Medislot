{% extends "portal.html" %}
{% from "partials/icons.html" import icon %}
{% block content %}
<form id="pform" class="card" novalidate>
  <div class="card-head"><div><h2>Your details</h2><p>Your doctor sees these when you book.</p></div></div>
  <div class="card-body">
    <div id="pnote" class="alert alert-info hidden" style="margin-bottom:18px"></div>
    <div class="form-grid">
      <div class="field"><label for="pf-dob">Date of birth</label><input class="input" id="pf-dob" name="dateOfBirth" type="date"></div>
      <div class="field"><label for="pf-gender">Gender</label><select class="input" id="pf-gender" name="gender"><option value="">Prefer not to say</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Other</option></select></div>
      <div class="field"><label for="pf-phone">Phone</label><input class="input" id="pf-phone" name="phone" type="tel" maxlength="20"></div>
      <div class="field"><label for="pf-city">City</label><input class="input" id="pf-city" name="city"></div>
      <div class="field full"><label for="pf-address">Address</label><input class="input" id="pf-address" name="address"></div>
      <div class="field full"><label for="pf-emerg">Emergency contact number</label><input class="input" id="pf-emerg" name="emergencyContact" type="tel" maxlength="20"></div>
    </div>
    <div class="alert alert-error hidden" id="perr" role="alert" style="margin-top:16px"></div>
    <div style="margin-top:22px;display:flex;justify-content:flex-end"><button class="btn btn-primary" type="submit" data-busy="Saving…">Save changes</button></div>
  </div>
</form>
<section class="card">
  <div class="card-head"><div><h2>Account</h2></div></div>
  <div class="card-body"><dl class="kv"><dt>Email</dt><dd>{{ email }}</dd><dt>Role</dt><dd>Patient</dd></dl></div>
</section>
{% endblock %}

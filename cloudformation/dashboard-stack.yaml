AWSTemplateFormatVersion: "2010-09-09"
Description: MediSlot Flask dashboard on a public EC2. Browser -> EC2 (port 80) -> API Gateway (HTTPS, server-side requests).

Parameters:
  Environment:
    Type: String
    Default: dev
  ApiBaseUrl:
    Type: String
    Description: API Gateway invoke URL including stage, no trailing slash
    MinLength: 32
  InstanceType:
    Type: String
    Default: t3.micro
  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair (leave empty to use SSM Session Manager instead of SSH)
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  SshCidr:
    Type: String
    Default: 18.206.107.24/29
    Description: Source range allowed on port 22. Default is the EC2 Instance Connect range for us-east-1 (browser Connect button). Add your own IP as x.x.x.x/32 for a normal SSH client; empty = no SSH rule (use Session Manager).
  DashboardBucketName:
    Type: String
    Description: Existing S3 bucket containing the dashboard bundle

Conditions:
  HasSsh: !Not [!Equals [!Ref SshCidr, ""]]
  HasKey: !Not [!Equals [!Ref KeyName, ""]]

Resources:

  DashboardSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Dashboard web access (HTTP in; all out so Flask can call API Gateway on 443)
      VpcId: !ImportValue
        Fn::Sub: MediSlot-${Environment}-VPCId
      SecurityGroupIngress:
        - {Description: HTTP, IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - !If
          - HasSsh
          - {Description: SSH / EC2 Instance Connect, IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SshCidr}
          - !Ref "AWS::NoValue"
      Tags:
        - {Key: Name, Value: !Sub "medislot-${Environment}-dashboard-sg"}

  DashboardRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-dashboard-bundle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${DashboardBucketName}/*"

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref DashboardRole]

  DashboardInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKey, !Ref KeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref DashboardInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !ImportValue
            Fn::Sub: MediSlot-${Environment}-PublicSubnetId
          GroupSet: [!Ref DashboardSecurityGroup]
      Tags:
        - {Key: Name, Value: !Sub "medislot-${Environment}-dashboard"}
        - {Key: Project, Value: MediSlot}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          dnf install -y python3-pip
          mkdir -p /opt/medislot/flask_session

          cat > /opt/medislot/.env <<'ENVVARS'
          API_BASE_URL=${ApiBaseUrl}
          SESSION_COOKIE_SECURE=0
          ENVVARS
          # The session secret is generated on the instance, so it never changes the stack and never lives in git
          echo "FLASK_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" >> /opt/medislot/.env
          chmod 600 /opt/medislot/.env

          cat > /opt/medislot/deploy.sh <<'DEPLOY'
          #!/bin/bash
          set -eux
          aws s3 cp s3://${DashboardBucketName}/dashboard/dashboard.tgz /tmp/dashboard.tgz
          tar -xzf /tmp/dashboard.tgz -C /opt/medislot
          [ -d /opt/medislot/venv ] || python3 -m venv /opt/medislot/venv
          /opt/medislot/venv/bin/pip install -r /opt/medislot/requirements.txt
          chown -R ec2-user:ec2-user /opt/medislot
          systemctl restart medislot
          DEPLOY
          chmod +x /opt/medislot/deploy.sh

          cat > /etc/systemd/system/medislot.service <<'UNIT'
          [Unit]
          Description=MediSlot dashboard
          After=network-online.target
          [Service]
          User=ec2-user
          WorkingDirectory=/opt/medislot
          EnvironmentFile=/opt/medislot/.env
          ExecStart=/opt/medislot/venv/bin/gunicorn -w 2 -b 0.0.0.0:80 app:app
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          Restart=always
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable medislot

          # Re-deploys the app whenever the pipeline uploads a new bundle (checked every 2 minutes)
          cat > /opt/medislot/auto-update.sh <<'UPDATE'
          #!/bin/bash
          etag=$(aws s3api head-object --bucket ${DashboardBucketName} --key dashboard/dashboard.tgz --query ETag --output text) || exit 0
          [ "$etag" = "$(cat /opt/medislot/.bundle-etag 2>/dev/null)" ] && exit 0
          /opt/medislot/deploy.sh && echo "$etag" > /opt/medislot/.bundle-etag
          UPDATE
          chmod +x /opt/medislot/auto-update.sh

          cat > /etc/systemd/system/medislot-update.service <<'UNIT'
          [Unit]
          Description=MediSlot dashboard bundle update
          [Service]
          Type=oneshot
          ExecStart=/opt/medislot/auto-update.sh
          UNIT
          cat > /etc/systemd/system/medislot-update.timer <<'UNIT'
          [Unit]
          Description=Check for a new MediSlot dashboard bundle
          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=2min
          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now medislot-update.timer

          # First install: wait (up to ~10 min) for the pipeline's bundle upload, then start the app
          for i in $(seq 1 60); do
            /opt/medislot/auto-update.sh
            [ -f /opt/medislot/.bundle-etag ] && break
            sleep 10
          done

Outputs:
  DashboardUrl:
    Value: !Sub "http://${DashboardInstance.PublicIp}"
  DashboardInstanceId:
    Value: !Ref DashboardInstance
  BucketName:
    Value: !Ref DashboardBucketName